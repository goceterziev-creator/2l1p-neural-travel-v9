name: HII V0.2 fresh blind semantic proof 1

on:
  push:
    branches:
      - experiment/hii-v0-2-fresh-blind-semantic-proof-1
    paths:
      - .github/workflows/hii-v0-2-fresh-blind-semantic-proof-1.yml

permissions:
  contents: read

concurrency:
  group: hii-v0-2-fresh-blind-semantic-proof-1
  cancel-in-progress: false

jobs:
  fresh-blind-semantic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport
      PROOF: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-1
      CORPUS: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-1/blind-corpus.json
      GOLD: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-1/hidden-gold.json
      RUN_DIR: /tmp/hii-v0-2-fresh-proof-1-run
      EVIDENCE_DIR: /tmp/hii-v0-2-fresh-proof-1-evidence
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout frozen proof commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify frozen corpus and hidden-gold identities
        id: frozen_inputs
        shell: bash
        run: |
          set -euo pipefail
          corpus_hash="$(sha256sum "$CORPUS" | cut -d ' ' -f 1)"
          gold_hash="$(sha256sum "$GOLD" | cut -d ' ' -f 1)"
          test "$corpus_hash" = "0f082782c5d25a0d47cc5fb9bc4fe1d25d239a0f0d6e294c5500ce5934b39af2"
          test "$gold_hash" = "6e2bec61ebfb3b1ecb41325d0557e386641c85d9035f292454946f11062623c5"
          printf '{"corpus":"%s","hiddenGold":"%s"}\n' "$corpus_hash" "$gold_hash" > "$RUNNER_TEMP/frozen-input-identities.json"

      - name: Prove generation sandbox cannot read hidden gold
        id: blindness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --permission --allow-fs-read="$CORPUS" -e 'require("node:fs").readFileSync(process.argv[1])' "$GOLD" > "$RUNNER_TEMP/gold-probe.stdout" 2> "$RUNNER_TEMP/gold-probe.stderr"
          probe_status=$?
          set -e
          test "$probe_status" -ne 0
          grep -Eqi 'permission|access|denied|ERR_ACCESS_DENIED' "$RUNNER_TEMP/gold-probe.stderr"
          printf '{"hiddenGoldReadDenied":true,"probeExit":%s}\n' "$probe_status" > "$RUNNER_TEMP/blindness.json"

      - name: Generate once and freeze exactly eight real-model candidates
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          node "$BASE/transport/run-generation.js" \
            --corpus "$CORPUS" \
            --output "$RUN_DIR" \
            --adapter openai \
            --run-id v0-2-fresh-blind-semantic-proof-1 \
            > "$RUNNER_TEMP/generation.json"
          test "$(node -e 'const f=require(process.argv[1]); process.stdout.write(String(f.totalModelCalls))' "$RUN_DIR/freeze.json")" = "8"
          test "$(node -e 'const f=require(process.argv[1]); process.stdout.write(String(f.sealed))' "$RUN_DIR/freeze.json")" = "true"

      - name: Evaluate sealed candidates against frozen hidden gold
        id: evaluation
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$GOLD" | cut -d ' ' -f 1)" = "6e2bec61ebfb3b1ecb41325d0557e386641c85d9035f292454946f11062623c5"
          node "$BASE/transport/run-evaluation.js" \
            --run-dir "$RUN_DIR" \
            --corpus "$CORPUS" \
            --gold "$GOLD" \
            --v0-module experiments/human-intent-layer-v0/intent-layer.js \
            --evaluator experiments/human-intent-interpreter-v0-1/acceptance-hardening/independent-semantic-evaluator.js \
            > "$RUNNER_TEMP/evaluation.json"

      - name: Accepted V0 regression
        id: v0
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --test experiments/human-intent-layer-v0/intent-layer.test.js > "$RUNNER_TEMP/v0.tap"

      - name: Accepted V0.1 independent acceptance
        id: v01
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" \
          HUMAN_INTENT_V0_MODULE="$GITHUB_WORKSPACE/experiments/human-intent-layer-v0/intent-layer.js" \
          node experiments/human-intent-interpreter-v0-1/acceptance-hardening/run-independent-acceptance.js > "$RUNNER_TEMP/v0-1.json"

      - name: V0.1 adversarial sensitivity
        id: v01_adversarial
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" \
          HUMAN_INTENT_V0_MODULE="$GITHUB_WORKSPACE/experiments/human-intent-layer-v0/intent-layer.js" \
          node experiments/human-intent-interpreter-v0-1/acceptance-hardening/adversarial-sensitivity.test.js > "$RUNNER_TEMP/v0-1-adversarial.json"

      - name: V0.2 transport regression
        id: transport
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node "$BASE/transport.test.js" > "$RUNNER_TEMP/transport.json"
          node "$BASE/transport-id-contract.test.js" > "$RUNNER_TEMP/id-contract.json"
          node "$BASE/transport-reference-contract.test.js" > "$RUNNER_TEMP/reference-contract.json"
          node "$BASE/transport-provenance-contract.test.js" > "$RUNNER_TEMP/provenance-contract.json"

      - name: Systemic semantic correction provider-free regression
        id: semantic_regression
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node "$BASE/semantic-correction-policy.test.js" > "$RUNNER_TEMP/semantic-positive.json"
          node "$BASE/semantic-adversarial-boundaries.test.js" > "$RUNNER_TEMP/semantic-adversarial.json"

      - name: Assemble immutable run evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if test -d "$RUN_DIR"; then cp -a "$RUN_DIR" "$EVIDENCE_DIR/run"; fi
          for file in frozen-input-identities.json blindness.json gold-probe.stderr generation.json evaluation.json v0.tap v0-1.json v0-1-adversarial.json transport.json id-contract.json reference-contract.json provenance-contract.json semantic-positive.json semantic-adversarial.json; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$EVIDENCE_DIR/$file"; fi
          done
          printf '{"repository":"%s","commit":"%s","runId":"%s","frozenInputs":"%s","blindness":"%s","generation":"%s","evaluation":"%s","v0":"%s","v01":"%s","v01Adversarial":"%s","transport":"%s","semanticRegression":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "${{ steps.frozen_inputs.outcome }}" "${{ steps.blindness.outcome }}" "${{ steps.generation.outcome }}" "${{ steps.evaluation.outcome }}" \
            "${{ steps.v0.outcome }}" "${{ steps.v01.outcome }}" "${{ steps.v01_adversarial.outcome }}" "${{ steps.transport.outcome }}" "${{ steps.semantic_regression.outcome }}" \
            > "$EVIDENCE_DIR/workflow-evidence.json"

      - name: Upload fresh blind proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hii-v0-2-fresh-blind-semantic-proof-1
          path: /tmp/hii-v0-2-fresh-proof-1-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.frozen_inputs.outcome }}" = "success" || { echo "BLOCKED: frozen input identity failed"; exit 20; }
          test "${{ steps.blindness.outcome }}" = "success" || { echo "BLOCKED: generation blindness proof failed"; exit 20; }
          test "${{ steps.generation.outcome }}" = "success" || { echo "BLOCKED: complete frozen candidate set not created"; exit 20; }
          test "${{ steps.evaluation.outcome }}" = "success" || { echo "BLOCKED: post-freeze independent evaluation did not complete"; exit 20; }
          test "${{ steps.v0.outcome }}" = "success" || { echo "FAIL: accepted V0 regression failed"; exit 1; }
          test "${{ steps.v01.outcome }}" = "success" || { echo "FAIL: accepted V0.1 regression failed"; exit 1; }
          test "${{ steps.v01_adversarial.outcome }}" = "success" || { echo "FAIL: accepted V0.1 adversarial sensitivity failed"; exit 1; }
          test "${{ steps.transport.outcome }}" = "success" || { echo "FAIL: V0.2 transport/provenance regression failed"; exit 1; }
          test "${{ steps.semantic_regression.outcome }}" = "success" || { echo "FAIL: systemic semantic correction regression failed"; exit 1; }
          status="$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.status)' "$RUNNER_TEMP/evaluation.json")"
          test "$status" = "PASS" || { echo "FAIL: sealed fresh candidates missed accepted semantic thresholds"; exit 1; }
          echo "PASS: fresh blind semantic proof met all gates"
