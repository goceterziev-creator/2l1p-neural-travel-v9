name: HII V0.2 fresh unseen blind semantic proof 8

on:
  push:
    branches:
      - experiment/hii-v0-2-fresh-unseen-blind-semantic-proof-8
    paths:
      - .github/workflows/hii-v0-2-fresh-unseen-blind-semantic-proof-8.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport
      CORPUS: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-8/blind-corpus.json
      GOLD: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-8/hidden-gold.json
      MANIFEST: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-8/freeze-manifest.json
      RUN_DIR: /tmp/hii-v0-2-fresh-proof-8-run
      EVIDENCE_DIR: /tmp/hii-v0-2-fresh-proof-8-evidence
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HUMAN_INTENT_V0_MODULE: ${{ github.workspace }}/experiments/human-intent-layer-v0/intent-layer.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify frozen corpus gold and manifest identities
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD:$CORPUS")" = "898fc3e8bde6ef51b4ce7bdca93f49ab82c6579e"
          test "$(git rev-parse "HEAD:$GOLD")" = "dced47e2e581cdb26f170302998cb7d35c3e9622"
          test "$(sha256sum "$CORPUS" | cut -d ' ' -f 1)" = "a571d9440abbfce59eb8c1f602dbe2600e4ceeae0b4f2560dcad1b7846649b40"
          test "$(sha256sum "$GOLD" | cut -d ' ' -f 1)" = "dc0927f35435628f99d7f97d239de7564e5f5fdad7ca368dd5654b5e6696f65d"
          node - "$MANIFEST" <<'NODE'
          const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(m.status!=='FROZEN_PRE_GENERATION'||m.providerCallsAtFreeze!==0||m.caseCount!==8) process.exit(1);
          if(m.corpus.gitBlob!=='898fc3e8bde6ef51b4ce7bdca93f49ab82c6579e'||m.corpus.sha256!=='a571d9440abbfce59eb8c1f602dbe2600e4ceeae0b4f2560dcad1b7846649b40') process.exit(1);
          if(m.hiddenGold.gitBlob!=='dced47e2e581cdb26f170302998cb7d35c3e9622'||m.hiddenGold.sha256!=='dc0927f35435628f99d7f97d239de7564e5f5fdad7ca368dd5654b5e6696f65d') process.exit(1);
          NODE
          test "$(node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(c.cases.length))' "$CORPUS")" = "8"
      - name: Prove generation cannot read hidden gold
        id: blindness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --permission --allow-fs-read="$CORPUS" -e 'require("node:fs").readFileSync(process.argv[1])' "$GOLD" > "$RUNNER_TEMP/gold-probe.stdout" 2> "$RUNNER_TEMP/gold-probe.stderr"
          s=$?
          set -e
          test "$s" -ne 0
          grep -Eqi 'permission|access|denied|ERR_ACCESS_DENIED' "$RUNNER_TEMP/gold-probe.stderr"
          printf '{"hiddenGoldReadDenied":true,"probeExit":%s}\n' "$s" > "$RUNNER_TEMP/blindness.json"
      - name: Generate exactly once only after freeze and blindness gates
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          env -u GOLD node "$BASE/transport/run-generation.js" --corpus "$CORPUS" --output "$RUN_DIR" --adapter openai --run-id v0-2-fresh-unseen-blind-semantic-proof-8 > "$RUNNER_TEMP/generation.json"
          test -f "$RUN_DIR/freeze.json"
          test "$(node -e 'const f=require(process.argv[1]);process.stdout.write(String(f.totalModelCalls))' "$RUN_DIR/freeze.json")" = "8"
          test "$(node -e 'const f=require(process.argv[1]);process.stdout.write(String(f.artifacts.length))' "$RUN_DIR/freeze.json")" = "8"
          test "$(node -e 'const f=require(process.argv[1]);process.stdout.write(String(f.sealed))' "$RUN_DIR/freeze.json")" = "true"
      - name: Evaluate sealed candidates independently
        id: evaluation
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node "$BASE/transport/run-evaluation.js" --run-dir "$RUN_DIR" --corpus "$CORPUS" --gold "$GOLD" --v0-module "$HUMAN_INTENT_V0_MODULE" --evaluator experiments/human-intent-interpreter-v0-1/acceptance-hardening/independent-semantic-evaluator.js > "$RUNNER_TEMP/evaluation.json"
      - name: Preserve proof evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp "$MANIFEST" "$EVIDENCE_DIR/freeze-manifest.json"
          test ! -f "$RUNNER_TEMP/blindness.json" || cp "$RUNNER_TEMP/blindness.json" "$EVIDENCE_DIR/blindness.json"
          test ! -f "$RUNNER_TEMP/gold-probe.stderr" || cp "$RUNNER_TEMP/gold-probe.stderr" "$EVIDENCE_DIR/gold-probe.stderr"
          test ! -f "$RUNNER_TEMP/generation.json" || cp "$RUNNER_TEMP/generation.json" "$EVIDENCE_DIR/generation.json"
          test ! -f "$RUNNER_TEMP/evaluation.json" || cp "$RUNNER_TEMP/evaluation.json" "$EVIDENCE_DIR/evaluation.json"
          if test -d "$RUN_DIR"; then cp -a "$RUN_DIR" "$EVIDENCE_DIR/run"; fi
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hii-v0-2-fresh-unseen-blind-semantic-proof-8
          path: /tmp/hii-v0-2-fresh-proof-8-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Enforce terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.frozen.outcome }}" = success || { echo 'BLOCKED: frozen identity'; exit 20; }
          test "${{ steps.blindness.outcome }}" = success || { echo 'BLOCKED: hidden gold isolation'; exit 20; }
          test "${{ steps.generation.outcome }}" = success || { echo 'BLOCKED: sealed candidate set not created'; exit 20; }
          test "${{ steps.evaluation.outcome }}" = success || { echo 'BLOCKED: evaluation incomplete'; exit 20; }
          status="$(node -e 'const r=require(process.argv[1]);process.stdout.write(r.status)' "$RUNNER_TEMP/evaluation.json")"
          test "$status" = PASS || { echo 'FAIL: fresh sealed candidates missed semantic thresholds'; exit 1; }
          echo 'PASS: HII V0.2 fresh unseen blind semantic proof 8'
