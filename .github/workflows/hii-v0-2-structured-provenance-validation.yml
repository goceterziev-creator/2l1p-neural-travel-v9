name: HII V0.2 structured provenance span validation

on:
  push:
    branches:
      - experiment/hii-v0-2-structured-provenance-spans

permissions:
  contents: read
  actions: read

jobs:
  provider-free-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport
      OPENAI_API_KEY: ""
      HUMAN_INTENT_V0_MODULE: ${{ github.workspace }}/experiments/human-intent-layer-v0/intent-layer.js
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Historical A21 and A31 remain rejected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a21" "$RUNNER_TEMP/a31"
          gh run download 32554370872 -n hii-v0-2-fresh-blind-semantic-proof-1 -D "$RUNNER_TEMP/a21"
          gh run download 32556374975 -n hii-v0-2-fresh-blind-semantic-proof-2 -D "$RUNNER_TEMP/a31"
          A21="$RUNNER_TEMP/a21/run/raw-responses/A21.json"
          A31="$RUNNER_TEMP/a31/run/raw-responses/A31.json"
          test "$(sha256sum "$A21" | cut -d ' ' -f 1)" = "30404f2cd18da8cb67584e4a7f52f73af1ddfe0ecdc7891dc123911fee2a5c55"
          test "$(sha256sum "$A31" | cut -d ' ' -f 1)" = "f18711ecf6f36ac8025242a8d6bab1354c4c02683e365db2ecc70a666c4a6285"
          test ! -e "$RUNNER_TEMP/a21/run/candidates/A21.json"
          test ! -e "$RUNNER_TEMP/a31/run/candidates/A31.json"
          test ! -e "$RUNNER_TEMP/a21/run/freeze.json"
          test ! -e "$RUNNER_TEMP/a31/run/freeze.json"
          node - "$A21" "$BASE/fresh-proof-1/blind-corpus.json" "$A31" "$BASE/fresh-proof-2/blind-corpus.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { extractCandidate } = require('./experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/transport/contract');
          for (const [rawPath, corpusPath, id] of [
            [process.argv[2], process.argv[3], 'A21'],
            [process.argv[4], process.argv[5], 'A31']
          ]) {
            const raw = JSON.parse(fs.readFileSync(rawPath, 'utf8'));
            const corpus = JSON.parse(fs.readFileSync(corpusPath, 'utf8'));
            const source = corpus.cases.find((item) => item.id === id);
            assert.throws(() => extractCandidate(raw, source));
          }
          process.stdout.write(JSON.stringify({status:'PASS',historicalA21StillRejected:true,historicalA31StillRejected:true,noCandidateRepair:true,noGoldRead:true,noModelCall:true}) + '\n');
          NODE

      - name: Provider-free validation run 1
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/run1"; mkdir -p "$OUT"
          node "$BASE/structured-provenance-span.test.js" > "$OUT/spans.json"
          node "$BASE/structured-provenance-adapter.test.js" > "$OUT/adapter.json"
          node "$BASE/structured-provenance-replay.test.js" > "$OUT/replay.json"
          node "$BASE/multi-span-provenance-representation.test.js" > "$OUT/multi-span.json"
          node --test experiments/human-intent-layer-v0/intent-layer.test.js > "$OUT/v0.tap"
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" node experiments/human-intent-interpreter-v0-1/acceptance-hardening/run-independent-acceptance.js > "$OUT/v01.json"
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" node experiments/human-intent-interpreter-v0-1/acceptance-hardening/adversarial-sensitivity.test.js > "$OUT/v01-adversarial.json"
          node "$BASE/transport.test.js" > "$OUT/transport.json"
          node "$BASE/transport-id-contract.test.js" > "$OUT/id.json"
          node "$BASE/transport-reference-contract.test.js" > "$OUT/reference.json"
          node "$BASE/transport-provenance-contract.test.js" > "$OUT/provenance.json"
          node "$BASE/semantic-correction-policy.test.js" > "$OUT/semantic-positive.json"
          node "$BASE/semantic-adversarial-boundaries.test.js" > "$OUT/semantic-adversarial.json"

      - name: Provider-free validation run 2
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/run2"; mkdir -p "$OUT"
          node "$BASE/structured-provenance-span.test.js" > "$OUT/spans.json"
          node "$BASE/structured-provenance-adapter.test.js" > "$OUT/adapter.json"
          node "$BASE/structured-provenance-replay.test.js" > "$OUT/replay.json"
          node "$BASE/multi-span-provenance-representation.test.js" > "$OUT/multi-span.json"
          node --test experiments/human-intent-layer-v0/intent-layer.test.js > "$OUT/v0.tap"
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" node experiments/human-intent-interpreter-v0-1/acceptance-hardening/run-independent-acceptance.js > "$OUT/v01.json"
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" node experiments/human-intent-interpreter-v0-1/acceptance-hardening/adversarial-sensitivity.test.js > "$OUT/v01-adversarial.json"
          node "$BASE/transport.test.js" > "$OUT/transport.json"
          node "$BASE/transport-id-contract.test.js" > "$OUT/id.json"
          node "$BASE/transport-reference-contract.test.js" > "$OUT/reference.json"
          node "$BASE/transport-provenance-contract.test.js" > "$OUT/provenance.json"
          node "$BASE/semantic-correction-policy.test.js" > "$OUT/semantic-positive.json"
          node "$BASE/semantic-adversarial-boundaries.test.js" > "$OUT/semantic-adversarial.json"

      - name: Determinism proof
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2; do
            sed -E '/^[[:space:]]*duration_ms:[[:space:]]*[0-9.]+[[:space:]]*$/d; /^# duration_ms[[:space:]]+[0-9.]+[[:space:]]*$/d' "$RUNNER_TEMP/run$n/v0.tap" > "$RUNNER_TEMP/run$n/v0.stable.tap"
          done
          cmp "$RUNNER_TEMP/run1/v0.stable.tap" "$RUNNER_TEMP/run2/v0.stable.tap"
          for file in spans.json adapter.json replay.json multi-span.json v01.json v01-adversarial.json transport.json id.json reference.json provenance.json semantic-positive.json semantic-adversarial.json; do
            cmp "$RUNNER_TEMP/run1/$file" "$RUNNER_TEMP/run2/$file"
          done
          echo 'PASS: two complete provider-free executions are materially deterministic'
