name: HII V0.2 fresh blind semantic proof 6

on:
  push:
    branches:
      - experiment/hii-v0-2-fresh-blind-semantic-proof-6
    paths:
      - .github/workflows/hii-v0-2-fresh-blind-semantic-proof-6.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport
      CORPUS: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-6/blind-corpus.json
      GOLD: experiments/human-intent-interpreter-v0-1/v0-2-automated-blind-transport/fresh-proof-6/hidden-gold.json
      RUN_DIR: /tmp/hii-v0-2-fresh-proof-6-run
      EVIDENCE_DIR: /tmp/hii-v0-2-fresh-proof-6-evidence
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HUMAN_INTENT_V0_MODULE: ${{ github.workspace }}/experiments/human-intent-layer-v0/intent-layer.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify frozen semantic identities
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD:$CORPUS")" = "d51d75127d6e3261a106580d394d74634e75e44a"
          test "$(git rev-parse "HEAD:$GOLD")" = "469ee51731fd72bb24b1ce5054b7858104881bab"
          test "$(node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(c.cases.length))' "$CORPUS")" = "8"
          corpus_sha256="$(sha256sum "$CORPUS" | cut -d ' ' -f 1)"
          gold_sha256="$(sha256sum "$GOLD" | cut -d ' ' -f 1)"
          printf '{"corpusGitBlob":"%s","hiddenGoldGitBlob":"%s","corpusSha256":"%s","hiddenGoldSha256":"%s","cases":8}\n' "d51d75127d6e3261a106580d394d74634e75e44a" "469ee51731fd72bb24b1ce5054b7858104881bab" "$corpus_sha256" "$gold_sha256" > "$RUNNER_TEMP/frozen.json"
      - name: Prove generation cannot read hidden gold
        id: blindness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --permission --allow-fs-read="$CORPUS" -e 'require("node:fs").readFileSync(process.argv[1])' "$GOLD" > "$RUNNER_TEMP/gold-probe.stdout" 2> "$RUNNER_TEMP/gold-probe.stderr"
          s=$?
          set -e
          test "$s" -ne 0
          grep -Eqi 'permission|access|denied|ERR_ACCESS_DENIED' "$RUNNER_TEMP/gold-probe.stderr"
          printf '{"hiddenGoldReadDenied":true,"probeExit":%s}\n' "$s" > "$RUNNER_TEMP/blindness.json"
      - name: Generate exactly once and seal eight candidates
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          env -u GOLD node "$BASE/transport/run-generation.js" --corpus "$CORPUS" --output "$RUN_DIR" --adapter openai --run-id v0-2-fresh-blind-semantic-proof-6 > "$RUNNER_TEMP/generation.json"
          test -f "$RUN_DIR/freeze.json"
          test "$(node -e 'const f=require(process.argv[1]);process.stdout.write(String(f.totalModelCalls))' "$RUN_DIR/freeze.json")" = "8"
          test "$(node -e 'const f=require(process.argv[1]);process.stdout.write(String(f.artifacts.length))' "$RUN_DIR/freeze.json")" = "8"
          test "$(node -e 'const f=require(process.argv[1]);process.stdout.write(String(f.sealed))' "$RUN_DIR/freeze.json")" = "true"
      - name: Evaluate sealed candidates independently
        id: evaluation
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node "$BASE/transport/run-evaluation.js" --run-dir "$RUN_DIR" --corpus "$CORPUS" --gold "$GOLD" --v0-module "$HUMAN_INTENT_V0_MODULE" --evaluator experiments/human-intent-interpreter-v0-1/acceptance-hardening/independent-semantic-evaluator.js > "$RUNNER_TEMP/evaluation.json"
      - name: Accepted and V0.2 provider-free regressions
        id: regressions
        if: steps.generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node experiments/human-intent-layer-v0/intent-layer.test.js > "$RUNNER_TEMP/v0.json"
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" HUMAN_INTENT_V0_MODULE="$HUMAN_INTENT_V0_MODULE" node experiments/human-intent-interpreter-v0-1/acceptance-hardening/run-independent-acceptance.js > "$RUNNER_TEMP/v01.json"
          FROZEN_EVIDENCE_DIR="$GITHUB_WORKSPACE/experiments/human-intent-interpreter-v0-1/autonomous-completion-pass-2" HUMAN_INTENT_V0_MODULE="$HUMAN_INTENT_V0_MODULE" node experiments/human-intent-interpreter-v0-1/acceptance-hardening/adversarial-sensitivity.test.js > "$RUNNER_TEMP/v01-adversarial.json"
          node "$BASE/transport.test.js" > "$RUNNER_TEMP/transport.json"
          node "$BASE/transport-id-contract.test.js" > "$RUNNER_TEMP/id.json"
          node "$BASE/transport-reference-contract.test.js" > "$RUNNER_TEMP/reference.json"
          node "$BASE/transport-provenance-contract.test.js" > "$RUNNER_TEMP/provenance.json"
          node "$BASE/semantic-correction-policy.test.js" > "$RUNNER_TEMP/semantic-positive.json"
          node "$BASE/semantic-adversarial-boundaries.test.js" > "$RUNNER_TEMP/semantic-adversarial.json"
          node "$BASE/provenance-discriminator-schema.test.js" > "$RUNNER_TEMP/discriminator.json"
          node "$BASE/inference-support-reference-discriminator.test.js" > "$RUNNER_TEMP/inference-reference.json"
          node "$BASE/structured-provenance-span.test.js" > "$RUNNER_TEMP/structured-span.json"
          node "$BASE/structured-provenance-adapter.test.js" > "$RUNNER_TEMP/structured-adapter.json"
          node "$BASE/structured-provenance-replay.test.js" > "$RUNNER_TEMP/structured-replay.json"
          node "$BASE/multi-span-provenance-representation.test.js" > "$RUNNER_TEMP/multispan.json"
      - name: Assemble immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if test -d "$RUN_DIR"; then cp -a "$RUN_DIR" "$EVIDENCE_DIR/run"; fi
          for f in frozen.json blindness.json gold-probe.stderr generation.json evaluation.json v0.json v01.json v01-adversarial.json transport.json id.json reference.json provenance.json semantic-positive.json semantic-adversarial.json discriminator.json inference-reference.json structured-span.json structured-adapter.json structured-replay.json multispan.json; do test ! -f "$RUNNER_TEMP/$f" || cp "$RUNNER_TEMP/$f" "$EVIDENCE_DIR/$f"; done
          printf '{"commit":"%s","runId":"%s","frozen":"%s","blindness":"%s","generation":"%s","evaluation":"%s","regressions":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ steps.frozen.outcome }}" "${{ steps.blindness.outcome }}" "${{ steps.generation.outcome }}" "${{ steps.evaluation.outcome }}" "${{ steps.regressions.outcome }}" > "$EVIDENCE_DIR/workflow-evidence.json"
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hii-v0-2-fresh-blind-semantic-proof-6
          path: /tmp/hii-v0-2-fresh-proof-6-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Enforce terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.frozen.outcome }}" = success || { echo 'BLOCKED: frozen identity'; exit 20; }
          test "${{ steps.blindness.outcome }}" = success || { echo 'BLOCKED: blindness'; exit 20; }
          test "${{ steps.generation.outcome }}" = success || { echo 'BLOCKED: sealed candidate set not created'; exit 20; }
          test "${{ steps.evaluation.outcome }}" = success || { echo 'BLOCKED: evaluation incomplete'; exit 20; }
          test "${{ steps.regressions.outcome }}" = success || { echo 'FAIL: accepted/provider-free regression'; exit 1; }
          status="$(node -e 'const r=require(process.argv[1]);process.stdout.write(r.status)' "$RUNNER_TEMP/evaluation.json")"
          test "$status" = PASS || { echo 'FAIL: fresh sealed candidates missed semantic thresholds'; exit 1; }
          echo 'PASS: HII V0.2 fresh blind semantic proof 6'
